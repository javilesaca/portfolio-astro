name: i18n-ai
# AI-assisted translation PR: runs ai-i18n-tools when a secret is configured.
# Setup: add repo secret I18N_PROVIDER_KEY (DeepL / Lingo.dev / OpenAI-compatible).
# Without the secret the job exits gracefully (green) so forks don't fail.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/content/projects/*.mdx"
      - "src/pages/index.astro"
      - "src/i18n/es.ts"
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check secret
        id: key
        run: |
          if [ -z "${{ secrets.I18N_PROVIDER_KEY }}" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: AI sync (placeholder)
        if: steps.key.outputs.present == 'true'
        env:
          I18N_PROVIDER_KEY: ${{ secrets.I18N_PROVIDER_KEY }}
        run: |
          npx -y ai-i18n-tools sync --config ai-i18n-tools.config.json
          git status --short
      - name: No secret — skip
        if: steps.key.outputs.present != 'true'
        run: echo "I18N_PROVIDER_KEY not set; skipping AI sync. See README Multilingual AI pipeline."
