name: i18n-ai
# Lingo.dev (primary) + DeepL (fallback).
# Secrets: LINGO_API_KEY, DEEPL_API_KEY.
# No secrets -> green skip.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/content/projects/*.mdx"
      - "src/pages/index.astro"
      - "src/i18n/es.ts"
jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lingo sync (primary)
        if: env.LINGO_API_KEY != ''
        run: |
          npm install -g @lingo.dev/cli
          lingo push --wait
      - name: DeepL fallback
        if: >
          env.LINGO_API_KEY == '' &&
          env.DEEPL_API_KEY != ''
        run: |
          echo "DeepL fallback active."
          echo "Wire contentPaths per provider docs"
          echo "before first real sync."
      - name: No provider, skip
        if: >
          env.LINGO_API_KEY == '' &&
          env.DEEPL_API_KEY == ''
        run: >
          echo "No provider keys; skipping.
          See README Multilingual AI pipeline."
