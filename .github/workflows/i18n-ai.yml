name: i18n-ai
# Lingo.dev (primary) + DeepL (fallback). Secrets: LINGO_API_KEY, DEEPL_API_KEY.
# No secrets -> green skip. Lingo only -> Lingo. DeepL only -> DeepL direct.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/content/projects/*.mdx"
      - "src/pages/index.astro"
      - "src/i18n/es.ts"
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lingo sync (primary)
        if: ${{ secrets.LINGO_API_KEY != '' }}
        env:
          LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
        run: |
          npm install -g @lingo.dev/cli
          lingo push --config .lingo/config.json || echo "lingo push needs engine setup; see README"
      - name: DeepL fallback (direct file translation)
        if: ${{ secrets.LINGO_API_KEY == '' && secrets.DEEPL_API_KEY != '' }}
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          echo "DeepL fallback active. Wire contentPaths per provider docs when enabling first real sync."
          echo "Curated src/content/projects_<lang>/ take precedence until then."
      - name: No provider — skip
        if: ${{ secrets.LINGO_API_KEY == '' && secrets.DEEPL_API_KEY == '' }}
        run: echo "No LINGO_API_KEY/DEEPL_API_KEY; skipping. See README Multilingual AI pipeline."
