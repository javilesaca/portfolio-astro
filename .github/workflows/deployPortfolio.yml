name: Deploy Portfolio (Astro) to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # El widget habla con el backend PHP de nova-stellar en el mismo dominio.
          PUBLIC_NOVA_ENDPOINT: /api/ask.php
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy dist/ to Namecheap via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # FTP lands jailed at the docroot: mirror into ./ (./public_html/
        # created a nested public_html/public_html/ black hole).
        run: |
          lftp -e "set ssl:verify-certificate no; \
            mirror -R ./dist/ ./; quit" \
            -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER"
